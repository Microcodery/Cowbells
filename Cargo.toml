[workspace]
resolver = "3"
members = ["crates/core", "crates/import", "crates/routing", "crates/plan", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
birdseye-core = { path = "crates/core" }
birdseye-import = { path = "crates/import" }
birdseye-routing = { path = "crates/routing" }
birdseye-plan = { path = "crates/plan" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
